name: Build NVIDIA modules and harvest logs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # weekly, Sunday 03:00 UTC

concurrency:
  group: build-and-harvest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/build:latest
    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout harvest-nvidia-logs
        uses: actions/checkout@v4

      - name: Prepare pacman (multilib + testing branch)
        run: |
          set -euxo pipefail

          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            sed -i 's/^#\(\[multilib\]\)/\1/' /etc/pacman.conf
            sed -i 's/^#\(Include = \/etc\/pacman\.d\/mirrorlist\)/\1/' /etc/pacman.conf
          fi

          pacman-mirrors --api -B testing -R || true
          pacman -Syy --noconfirm
          pacman -Suu --noconfirm

      - name: Create builder user
        run: |
          set -euxo pipefail

          if ! id builder >/dev/null 2>&1; then
            useradd -m -G wheel -s /bin/bash builder
          fi
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

          # Make sure builder owns the workspace so it can read the scripts
          chown -R builder:builder "${WORKSPACE}"

          # Prepare build directories
          mkdir -p /build/harvest /build/diag /build/utils
          chown -R builder:builder /build

          # Fetch previous results branch (for --diff / changelog)
          if git clone --depth 1 --branch results \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              /tmp/prev 2>/dev/null; then
            [ -d /tmp/prev/history ] && cp -r /tmp/prev/history /build/harvest/ || true
            [ -f /tmp/prev/driver-changelog.md ] && \
              cp /tmp/prev/driver-changelog.md /build/harvest/ || true
            chown -R builder:builder /build/harvest
          fi

      - name: Clone driver repos
        run: |
          set -euxo pipefail
          sudo -u builder -H bash -c '
            set -euxo pipefail
            cd /build/diag
            git clone --depth 1 https://github.com/megvadulthangya/nvidia-340xx.git
            git clone --depth 1 https://github.com/megvadulthangya/nvidia-390xx.git

            cd /build/utils
            git clone -b develop --depth 1 https://github.com/megvadulthangya/nvidia-340xx-utils.git
            git clone -b develop --depth 1 https://github.com/megvadulthangya/nvidia-390xx-utils.git
          '

      - name: Pre-install all required kernels and headers
        run: |
          set -uo pipefail

          # --- Collect kernel prefixes from repo directory names -----------
          declare -A KERNELS

          for drv in 340xx 390xx; do
            for variant in normal rt; do
              root="/build/diag/nvidia-${drv}/${variant}-kernels"
              [ -d "$root" ] || continue
              for kdir in "$root"/linux*/; do
                [ -d "$kdir" ] || continue
                name=$(basename "$kdir")     # linux612-rt-nvidia-390xx
                prefix="${name%%-nvidia-*}"  # linux612-rt
                KERNELS["$prefix"]=1
              done
            done
          done

          if [ "${#KERNELS[@]}" -eq 0 ]; then
            echo "no kernel prefixes found — nothing to pre-install"
            exit 0
          fi

          echo "=== Kernels to pre-install ==="
          printf '  %s\n' "${!KERNELS[@]}" | sort

          # --- Install kernels + headers ---------------------------------
          # 'linuxXX-headers' depends on 'linuxXX', so listing headers alone
          # would pull the kernel too. We list both explicitly for clarity.
          for prefix in "${!KERNELS[@]}"; do
            echo "==> pacman -S --needed ${prefix} ${prefix}-headers"
            pacman -S --noconfirm --needed "${prefix}" "${prefix}-headers" \
              || echo "    [warn] not available: ${prefix} or ${prefix}-headers"
          done

          echo "=== Installed kernels ==="
          pacman -Qq | grep -E '^linux.*(-headers)?$' | sort || true
          
      - name: Build all drivers sequentially (as builder)
        env:
          WS: ${{ github.workspace }}
        run: |
          set -uo pipefail
          sudo -u builder -H bash <<BUILD_SCRIPT
          set -uo pipefail
          WS="${WS}"

          for drv in 340xx 390xx; do
            echo "::group::Building nvidia-\${drv}"

            utils_dir="/build/utils/nvidia-\${drv}-utils"
            if [ -d "\$utils_dir" ]; then
              echo "==> utils: \$utils_dir"
              cd "\$utils_dir"
              makepkg -si --noconfirm --skippgpcheck \\
                || echo "    [warn] utils build failed for \$drv"
            else
              echo "    [warn] no utils repo for \$drv"
            fi

            repo_dir="/build/diag/nvidia-\${drv}"
            for variant in normal rt; do
              kdir_root="\${repo_dir}/\${variant}-kernels"
              [ -d "\$kdir_root" ] || continue

              for kdir in "\$kdir_root"/*/; do
                [ -d "\$kdir" ] || continue
                name=\$(basename "\$kdir")
                echo "==> kernel module: \$name"
                cd "\$kdir"
                makepkg -s --noconfirm --skippgpcheck \\
                  || echo "    [warn] build failed: \$name"
              done
            done

            echo "==> cleanup after nvidia-\${drv}"
            sudo bash "\${WS}/clean-nvidia-container.sh" "\$drv" || true

            echo "::endgroup::"
          done
          BUILD_SCRIPT

      - name: Harvest
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}"

          # harvest can run as root or builder; run as builder for consistency
          sudo -u builder -H bash -c "
            cd '${WORKSPACE}'
            ./harvest-nvidia-logs \
              -d /build/diag \
              -o /build/harvest \
              --diff \
              --changelog /build/harvest/driver-changelog.md \
              --history-keep 30 \
              -q
          "

      - name: Add README.md mirrors
        run: |
          set -euxo pipefail

          [ -f /build/harvest/INDEX.md ] && cp /build/harvest/INDEX.md /build/harvest/README.md

          for d in /build/harvest/history/*/; do
            [ -f "$d/INDEX.md" ] && cp "$d/INDEX.md" "$d/README.md"
          done

      - name: Publish to results branch
        run: |
          set -euxo pipefail

          rm -rf /tmp/publish
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/publish

          cd /tmp/publish
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          # Switch to results branch (or create it from main on first run)
          if git ls-remote --exit-code origin results >/dev/null 2>&1; then
            git fetch --depth 1 origin results
            git checkout -B results origin/results
          else
            git checkout -B results
          fi

          # Replace the working tree with the harvest output
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /build/harvest/. .

          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "harvest: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin results
          fi
