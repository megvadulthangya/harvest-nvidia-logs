# ============================================================================
# Official Manjaro NVIDIA build + harvest
# ============================================================================
#
# Builds the official Manjaro nvidia packages and pushes the harvest
# result to a dedicated `official-results` branch.  Kept separate from
# build.yaml so the two never interfere.
#
# ----------------------------------------------------------------------------
# WHAT GETS BUILT — the `url` input decides
# ----------------------------------------------------------------------------
#
# The default URL (see `workflow_dispatch` inputs below) points at
# Manjaro's current flat repository.  Two alternative URL forms are
# also supported; you can switch by simply typing a different URL
# into the "Run workflow" dialog — no file edit required.
#
# 1.  https://code.manjaro.org/packages/PKGBUILDs.git
#     FLAT (current).  Single repository, every PKGBUILD is a
#     subdirectory inside it.  This is the default.
#
# 2.  https://code.manjaro.org/packages
#     NON-FLAT, one repo per package.  Use this if Manjaro later
#     splits the flat tree back into individual repositories
#     (nvidia-XXX-utils, linuxYY-extramodules/nvidia-XXX, …).
#     nvidia-ci.py calls the Forgejo API, lists every repo in the
#     `packages` org, and keeps the nvidia-* ones.  No exact
#     subgroup path needs to be known.
#
#     A host-only form (https://code.manjaro.org) also works as a
#     global instance search, but Forgejo's global search only
#     matches repository names — prefer the org-scoped form.
#
# 3.  https://gitlab.manjaro.org
#     HISTORICAL reference.  The old Manjaro GitLab instance is now
#     read-only (archived).  It hosted exactly the non-flat layout
#     we anticipate in (2), so it stays here as a working example
#     of the non-flat code path.  Do not use in production.
#     Note the URL is only the host: GitLab's global project
#     search finds every nvidia-* project anywhere on the
#     instance without needing a specific group name.
#
# ----------------------------------------------------------------------------
# BRANCH OVERRIDES
# ----------------------------------------------------------------------------
#
# In flat mode (URL form 1), `source-branch` selects the branch to
# clone.  Empty means the remote default branch.
#
# In non-flat mode (URL forms 2 and 3), `drivers-branch` and
# `kernels-branch` override the default branch of the utils and
# kernel-module repositories respectively.  Empty means each
# repository's own default branch.
# ============================================================================

name: Build Manjaro official NVIDIA modules and harvest logs

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Source URL — see file header for supported forms"
        required: true
        default: "https://code.manjaro.org/packages/PKGBUILDs.git"
      source-branch:
        description: "Flat repo branch (empty = remote default)"
        required: false
        default: ""
      drivers-branch:
        description: "Non-flat drivers branch (empty = remote default)"
        required: false
        default: ""
      kernels-branch:
        description: "Non-flat kernel modules branch (empty = remote default)"
        required: false
        default: ""
      manjaro-branch:
        description: "Manjaro branch"
        type: choice
        options:
          - stable
          - testing
          - unstable
        default: testing
      drivers:
        description: "Driver whitelist, comma-separated (empty = all)"
        required: false
        default: ""
      exclude-drivers:
        description: "Driver blacklist, comma-separated"
        required: false
        default: ""
      kernels:
        description: "Kernel prefix whitelist, comma-separated (empty = all)"
        required: false
        default: ""
      exclude-kernels:
        description: "Kernel prefix blacklist, comma-separated"
        required: false
        default: ""
      results-branch:
        description: "Results branch to push to"
        required: true
        default: "official-results"
      publish:
        description: "Push results to GitHub"
        type: boolean
        default: true
      history-keep:
        description: "History snapshots to keep"
        required: false
        default: "30"
      raw-logs:
        description: "Archive raw make.log (none | non-clean | all)"
        type: choice
        options:
          - none
          - non-clean
          - all
        default: all
      raw-logs-format:
        description: "Compression for raw logs"
        type: choice
        options:
          - auto
          - zstd
          - gzip
          - none
        default: auto

  schedule:
    - cron: '0 4 * * 0'

concurrency:
  group: build-nvidia-official
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/build:latest
    permissions:
      contents: write

    env:
      URL:              ${{ inputs.url             || 'https://code.manjaro.org/packages/PKGBUILDs.git' }}
      SOURCE_BRANCH:    ${{ inputs.source-branch   || '' }}
      DRIVERS_BRANCH:   ${{ inputs.drivers-branch  || '' }}
      KERNELS_BRANCH:   ${{ inputs.kernels-branch  || '' }}
      MANJARO_BRANCH:   ${{ inputs.manjaro-branch  || 'testing' }}
      DRIVERS:          ${{ inputs.drivers         || '' }}
      EXCLUDE_DRIVERS:  ${{ inputs.exclude-drivers || '' }}
      KERNELS:          ${{ inputs.kernels         || '' }}
      EXCLUDE_KERNELS:  ${{ inputs.exclude-kernels || '' }}
      RESULTS_BRANCH:   ${{ inputs.results-branch  || 'official-results' }}
      PUBLISH:          ${{ inputs.publish }}
      HISTORY_KEEP:     ${{ inputs.history-keep    || '30' }}
      RAW_LOGS:         ${{ inputs.raw-logs        || 'non-clean' }}
      RAW_LOGS_FORMAT:  ${{ inputs.raw-logs-format || 'auto' }}

      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout harvest-nvidia-logs
        uses: actions/checkout@v4

      - name: Configure pacman (multilib + branch)
        run: |
          set -euxo pipefail

          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            sed -i 's/^#\(\[multilib\]\)/\1/' /etc/pacman.conf
            sed -i 's/^#\(Include = \/etc\/pacman\.d\/mirrorlist\)/\1/' /etc/pacman.conf
          fi

          pacman-mirrors --api -B "${MANJARO_BRANCH}" -R || true
          pacman -Syy --noconfirm
          pacman -Suu --noconfirm

          pacman -S --noconfirm --needed python sudo zstd

      - name: Create builder user
        run: |
          set -euxo pipefail

          if ! id builder >/dev/null 2>&1; then
            useradd -m -G wheel -s /bin/bash builder
          fi
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

          chown -R builder:builder "${GITHUB_WORKSPACE}"

          mkdir -p /build
          chown -R builder:builder /build

      - name: Install helpers
        run: |
          set -euxo pipefail

          install -m 755 harvest-nvidia-logs /usr/local/bin/harvest-nvidia-logs
          install -m 755 clean-nvidia-container.sh /build/clean-nvidia-container.sh
          chown builder:builder /build/clean-nvidia-container.sh

      - name: Run nvidia-ci
        run: |
          set -euxo pipefail

          args=(
            --all
            --url "${URL}"
            --manjaro-branch "${MANJARO_BRANCH}"
            --results-branch "${RESULTS_BRANCH}"
            --history-keep "${HISTORY_KEEP}"
            --raw-logs "${RAW_LOGS}"
            --raw-logs-format "${RAW_LOGS_FORMAT}"
          )

          if [ -n "${SOURCE_BRANCH}" ]; then
            args+=(--source-branch "${SOURCE_BRANCH}")
          fi
          if [ -n "${DRIVERS_BRANCH}" ]; then
            args+=(--drivers-branch "${DRIVERS_BRANCH}")
          fi
          if [ -n "${KERNELS_BRANCH}" ]; then
            args+=(--kernels-branch "${KERNELS_BRANCH}")
          fi
          if [ -n "${DRIVERS}" ]; then
            args+=(--drivers "${DRIVERS}")
          fi
          if [ -n "${EXCLUDE_DRIVERS}" ]; then
            args+=(--exclude-drivers "${EXCLUDE_DRIVERS}")
          fi
          if [ -n "${KERNELS}" ]; then
            args+=(--kernels "${KERNELS}")
          fi
          if [ -n "${EXCLUDE_KERNELS}" ]; then
            args+=(--exclude-kernels "${EXCLUDE_KERNELS}")
          fi
          if [ "${PUBLISH}" != "false" ]; then
            args+=(--publish)
          fi

          echo "nvidia-ci args: ${args[*]}"
          sudo -u builder -H env \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            python3 nvidia-ci.py "${args[@]}"
