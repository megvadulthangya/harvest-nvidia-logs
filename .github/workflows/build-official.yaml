name: Build Manjaro official NVIDIA modules and harvest logs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # weekly, Sunday 04:00 UTC (one hour after custom)

concurrency:
  group: build-official
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/build:latest
    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout harvest-nvidia-logs
        uses: actions/checkout@v4

      - name: Prepare pacman (multilib + testing branch)
        run: |
          set -euxo pipefail

          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            sed -i 's/^#\(\[multilib\]\)/\1/' /etc/pacman.conf
            sed -i 's/^#\(Include = \/etc\/pacman\.d\/mirrorlist\)/\1/' /etc/pacman.conf
          fi

          pacman-mirrors --api -B testing -R || true
          pacman -Syy --noconfirm
          pacman -Suu --noconfirm

      - name: Create builder user and clone official PKGBUILDs
        run: |
          set -euxo pipefail

          if ! id builder >/dev/null 2>&1; then
            useradd -m -G wheel -s /bin/bash builder
          fi
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

          chown -R builder:builder "${WORKSPACE}"

          mkdir -p /build/harvest-official /build/official
          chown -R builder:builder /build

          # Fetch previous official-results branch (for --diff / changelog)
          if git clone --depth 1 --branch official-results \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              /tmp/prev 2>/dev/null; then
            [ -d /tmp/prev/history ] && \
              cp -r /tmp/prev/history /build/harvest-official/ || true
            [ -f /tmp/prev/driver-changelog.md ] && \
              cp /tmp/prev/driver-changelog.md /build/harvest-official/ || true
            chown -R builder:builder /build/harvest-official
          fi

          # Clone the Manjaro flat PKGBUILDs repo
          sudo -u builder -H bash -c '
            set -euxo pipefail
            git clone --depth 1 \
              https://code.manjaro.org/packages/PKGBUILDs.git \
              /build/official
          '

      - name: Pre-install kernels and headers
        run: |
          set -uo pipefail

          declare -A KERNELS

          for extramod in /build/official/extra/linux*-extramodules; do
            [ -d "$extramod" ] || continue
            prefix=$(basename "$extramod" | sed 's/-extramodules$//')
            KERNELS["$prefix"]=1
          done

          if [ "${#KERNELS[@]}" -eq 0 ]; then
            echo "no kernel prefixes found"
            exit 0
          fi

          echo "=== Kernels to pre-install ==="
          printf '  %s\n' "${!KERNELS[@]}" | sort

          for prefix in "${!KERNELS[@]}"; do
            echo "==> pacman -S --needed ${prefix} ${prefix}-headers"
            pacman -S --noconfirm --needed "${prefix}" "${prefix}-headers" \
              || echo "    [warn] not available: ${prefix} or ${prefix}-headers"
          done

          echo "=== Installed kernels ==="
          pacman -Qq | grep -E '^linux.*(-headers)?$' | sort || true

      - name: Build official utils and kernel modules sequentially
        env:
          WS: ${{ github.workspace }}
        run: |
          set -uo pipefail
          sudo -u builder -H bash <<BUILD_SCRIPT
          set -uo pipefail
          WS="${WS}"

          # utils-name → list of nvidia kernel-module folders it provides
          declare -A UTILS_TO_MODULES
          UTILS_TO_MODULES[nvidia-390xx-utils]="nvidia-390xx"
          UTILS_TO_MODULES[nvidia-470xx-utils]="nvidia-470xx"
          UTILS_TO_MODULES[nvidia-580xx-utils]="nvidia-580xx nvidia-580xx-open"
          UTILS_TO_MODULES[nvidia-utils]="nvidia nvidia-open"

          for utils_name in nvidia-390xx-utils nvidia-470xx-utils nvidia-580xx-utils nvidia-utils; do
            utils_dir="/build/official/extra/\${utils_name}"
            [ -d "\$utils_dir" ] || { echo "    [warn] no utils: \${utils_name}"; continue; }

            echo "::group::Building \${utils_name}"

            # ---- 1. utils (installs -dkms) --------------------------------
            cd "\$utils_dir"
            makepkg -si --noconfirm --skippgpcheck \\
              || echo "    [warn] utils build failed: \${utils_name}"

            # ---- 2. kernel modules for this branch ------------------------
            for nv_folder in \${UTILS_TO_MODULES[\$utils_name]}; do
              for extramod in /build/official/extra/linux*-extramodules; do
                kdir="\$extramod/\$nv_folder"
                [ -d "\$kdir" ] || continue
                echo "==> \$(basename "\$extramod") / \$nv_folder"
                cd "\$kdir"
                makepkg -s --noconfirm --skippgpcheck \\
                  || echo "    [warn] build failed: \$kdir"
              done
            done

            # ---- 3. cleanup after this branch -----------------------------
            case "\$utils_name" in
              nvidia-390xx-utils) drv=390xx ;;
              nvidia-470xx-utils) drv=470xx ;;
              nvidia-580xx-utils) drv=580xx ;;
              nvidia-utils)       drv=current ;;
            esac
            echo "==> cleanup after \${drv}"
            sudo bash "\${WS}/clean-nvidia-container.sh" "\$drv" || true

            echo "::endgroup::"
          done
          BUILD_SCRIPT

      - name: Harvest
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}"

          sudo -u builder -H bash -c "
            cd '${WORKSPACE}'
            ./harvest-nvidia-logs \
              -d /build/official/extra \
              -o /build/harvest-official \
              --diff \
              --changelog /build/harvest-official/driver-changelog.md \
              --history-keep 30 \
              -q
          "

      - name: Add README.md mirrors
        run: |
          set -euxo pipefail

          [ -f /build/harvest-official/INDEX.md ] && \
            cp /build/harvest-official/INDEX.md /build/harvest-official/README.md

          for d in /build/harvest-official/history/*/; do
            [ -f "$d/INDEX.md" ] && cp "$d/INDEX.md" "$d/README.md"
          done

      - name: Publish to official-results branch
        run: |
          set -euxo pipefail

          rm -rf /tmp/publish
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/publish

          cd /tmp/publish
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          if git ls-remote --exit-code origin official-results >/dev/null 2>&1; then
            git fetch --depth 1 origin official-results
            git checkout -B official-results origin/official-results
          else
            git checkout -B official-results
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /build/harvest-official/. .

          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "official harvest: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin official-results
          fi