# ============================================================================
# Custom fork NVIDIA build + harvest
# ============================================================================
#
# Builds the custom fork repositories (megvadulthangya/nvidia-*) and
# pushes the harvest result to the `results` branch.
#
# Default: GitHub user megvadulthangya, develop branch for both the
# utils and the kernel-module repositories.
# ============================================================================

name: Build NVIDIA modules and harvest logs

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Source URL — flat repo (.git) OR user/org/group"
        required: true
        default: "https://github.com/megvadulthangya"
      source-branch:
        description: "Flat repo branch (empty = remote default)"
        required: false
        default: ""
      drivers-branch:
        description: "Non-flat drivers branch (empty = remote default)"
        required: false
        default: "develop"
      kernels-branch:
        description: "Non-flat kernel modules branch (empty = remote default)"
        required: false
        default: "develop"
      manjaro-branch:
        description: "Manjaro branch"
        type: choice
        options:
          - stable
          - testing
          - unstable
        default: testing
      drivers:
        description: "Driver whitelist, comma-separated (empty = all)"
        required: false
        default: ""
      exclude-drivers:
        description: "Driver blacklist, comma-separated"
        required: false
        default: ""
      kernels:
        description: "Kernel prefix whitelist, comma-separated (empty = all)"
        required: false
        default: ""
      exclude-kernels:
        description: "Kernel prefix blacklist, comma-separated"
        required: false
        default: ""
      results-branch:
        description: "Results branch to push to"
        required: true
        default: "results"
      publish:
        description: "Push results to GitHub"
        type: boolean
        default: true
      history-keep:
        description: "History snapshots to keep"
        required: false
        default: "30"
      raw-logs:
        description: "Archive raw make.log (none | non-clean | all)"
        type: choice
        options:
          - none
          - non-clean
          - all
        default: all
      raw-logs-format:
        description: "Compression for raw logs"
        type: choice
        options:
          - auto
          - zstd
          - gzip
          - none
        default: auto

  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: build-nvidia-custom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/build:latest
    permissions:
      contents: write

    env:
      URL:              ${{ inputs.url             || 'https://github.com/megvadulthangya' }}
      SOURCE_BRANCH:    ${{ inputs.source-branch   || '' }}
      DRIVERS_BRANCH:   ${{ inputs.drivers-branch  || 'develop' }}
      KERNELS_BRANCH:   ${{ inputs.kernels-branch  || 'develop' }}
      MANJARO_BRANCH:   ${{ inputs.manjaro-branch  || 'testing' }}
      DRIVERS:          ${{ inputs.drivers         || '' }}
      EXCLUDE_DRIVERS:  ${{ inputs.exclude-drivers || '' }}
      KERNELS:          ${{ inputs.kernels         || '' }}
      EXCLUDE_KERNELS:  ${{ inputs.exclude-kernels || '' }}
      RESULTS_BRANCH:   ${{ inputs.results-branch  || 'results' }}
      PUBLISH:          ${{ inputs.publish }}
      HISTORY_KEEP:     ${{ inputs.history-keep    || '30' }}
      RAW_LOGS:         ${{ inputs.raw-logs        || 'non-clean' }}
      RAW_LOGS_FORMAT:  ${{ inputs.raw-logs-format || 'auto' }}

      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout harvest-nvidia-logs
        uses: actions/checkout@v4

      - name: Configure pacman (multilib + branch)
        run: |
          set -euxo pipefail

          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            sed -i 's/^#\(\[multilib\]\)/\1/' /etc/pacman.conf
            sed -i 's/^#\(Include = \/etc\/pacman\.d\/mirrorlist\)/\1/' /etc/pacman.conf
          fi

          pacman-mirrors --api -B "${MANJARO_BRANCH}" -R || true
          pacman -Syy --noconfirm
          pacman -Suu --noconfirm

          pacman -S --noconfirm --needed python sudo zstd

      - name: Configure manjaro-awesome repository (with GPG key)
        continue-on-error: true
        run: |
          set -uo pipefail

          REPO_NAME="manjaro-awesome"
          REPO_SERVER_URL="https://repo.gshoots.hu/manjaro-awesome/x86_64"
          KEY_ID="A9A569C8F797B6878E44C4F8FBF4AB57E9BB9D3C"
          REPO_FILE="/etc/pacman.d/${REPO_NAME}"

          echo "=== Configuring repository ${REPO_NAME} with GPG key ==="

          if pacman-key --list-keys "$KEY_ID" >/dev/null 2>&1; then
            echo "Key $KEY_ID already imported"
          else
            echo "Importing key $KEY_ID from keyserver..."
            if ! pacman-key --keyserver keyserver.ubuntu.com --recv-keys "$KEY_ID"; then
              echo "Keyserver failed, trying fallback URL..."
              curl -fsSL "https://repo.gshoots.hu/${REPO_NAME}/x86_64/${REPO_NAME}.pub" | pacman-key --add -
            fi
          fi

          pacman-key --lsign-key "$KEY_ID" || true

          echo "Server = ${REPO_SERVER_URL}" > "$REPO_FILE"
          chmod 644 "$REPO_FILE"

          if ! grep -q "^\[${REPO_NAME}\]" /etc/pacman.conf; then
            echo "Inserting [${REPO_NAME}] before [extra] in pacman.conf"
            awk -v repo="[${REPO_NAME}]" -v inc="Include = ${REPO_FILE}" '
              /^\[extra\]/ {
                print repo
                print "SigLevel = PackageRequired"
                print inc
                print ""
              }
              { print }
            ' /etc/pacman.conf > /tmp/pacman.conf.tmp && mv /tmp/pacman.conf.tmp /etc/pacman.conf
          else
            echo "[${REPO_NAME}] already present in pacman.conf"
          fi

          pacman -Syy || echo "pacman -Syy failed, repository database may be missing - continuing"

          echo "Repository ${REPO_NAME} configured successfully"

      - name: Create builder user
        run: |
          set -euxo pipefail

          if ! id builder >/dev/null 2>&1; then
            useradd -m -G wheel -s /bin/bash builder
          fi
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

          chown -R builder:builder "${GITHUB_WORKSPACE}"

          mkdir -p /build
          chown -R builder:builder /build

      - name: Install helpers
        run: |
          set -euxo pipefail

          install -m 755 harvest-nvidia-logs /usr/local/bin/harvest-nvidia-logs
          install -m 755 clean-nvidia-container.sh /build/clean-nvidia-container.sh
          chown builder:builder /build/clean-nvidia-container.sh

      - name: Run nvidia-ci
        run: |
          set -euxo pipefail

          args=(
            --all
            --url "${URL}"
            --manjaro-branch "${MANJARO_BRANCH}"
            --results-branch "${RESULTS_BRANCH}"
            --history-keep "${HISTORY_KEEP}"
            --raw-logs "${RAW_LOGS}"
            --raw-logs-format "${RAW_LOGS_FORMAT}"
          )

          if [ -n "${SOURCE_BRANCH}" ]; then
            args+=(--source-branch "${SOURCE_BRANCH}")
          fi
          if [ -n "${DRIVERS_BRANCH}" ]; then
            args+=(--drivers-branch "${DRIVERS_BRANCH}")
          fi
          if [ -n "${KERNELS_BRANCH}" ]; then
            args+=(--kernels-branch "${KERNELS_BRANCH}")
          fi
          if [ -n "${DRIVERS}" ]; then
            args+=(--drivers "${DRIVERS}")
          fi
          if [ -n "${EXCLUDE_DRIVERS}" ]; then
            args+=(--exclude-drivers "${EXCLUDE_DRIVERS}")
          fi
          if [ -n "${KERNELS}" ]; then
            args+=(--kernels "${KERNELS}")
          fi
          if [ -n "${EXCLUDE_KERNELS}" ]; then
            args+=(--exclude-kernels "${EXCLUDE_KERNELS}")
          fi
          if [ "${PUBLISH}" != "false" ]; then
            args+=(--publish)
          fi

          echo "nvidia-ci args: ${args[*]}"
          sudo -u builder -H env \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            python3 nvidia-ci.py "${args[@]}"
